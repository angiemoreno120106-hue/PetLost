<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | PetLost</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/feed.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="brand-box" onclick="window.location.href='index.html'" style="cursor: pointer;">
                <img src="assets/logo.png" alt="PetLost" class="logo-img">
                <div class="brand-text">
                    <h1 class="brand-title">PetLost</h1>
                    <p class="brand-slogan">BUSCA • CONECTA • REENCUENTRA</p>
                </div>
            </div>

            <div class="mission-box">
                <div class="line-yellow"></div>
                <p class="mission-text">Ayudamos a unir familias</p>
                <div class="line-yellow"></div>
            </div>

            <div class="nav-auth">
                <a href="feed.html" style="text-decoration: none; color: inherit; font-weight: 700; margin-right: 20px; font-size: 0.9rem;">VOLVER AL FEED</a>
                <button class="btn-reportar" onclick="window.location.href='reportar.html'" style="background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem;">
                    + NUEVO REPORTE
                </button>
            </div>
        </div>
    </nav>

    <div style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
        <div style="background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 25px; margin-bottom: 40px;">
            <div style="width: 80px; height: 80px; background: #10b981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" style="width: 45px; color: white;">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 19C20 17.3431 16.4183 16 12 16C7.58172 16 4 17.3431 4 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <h2 style="margin: 0; font-weight: 800; color: #1e293b;" id="perfil-nombre-usuario">Usuario Comunitario</h2>
                <p style="margin: 5px 0 0; color: #64748b; font-size: 0.9rem;" id="perfil-id-usuario">ID: Cargando...</p>
            </div>
        </div>

        <main class="feed-container" style="padding: 0;">
            <div style="width: 100%; grid-column: 1 / -1; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <div style="width: 6px; height: 25px; background: #10b981; border-radius: 10px;"></div>
                <h3 style="font-weight: 800; margin: 0; font-size: 1.3rem; color: #1e293b;">Mascotas que he reportado</h3>
            </div>

            <div id="mis-reportes-lista" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; grid-column: 1 / -1;">
                </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
          
            if (!localStorage.getItem("userIdActual")) {
                localStorage.setItem("userIdActual", "user_" + Math.random().toString(36).substr(2, 9));
            }

            mostrarDatosIdentidad();
            renderizarMisReportes();
        });

        function mostrarDatosIdentidad() {
            const miUsuarioId = localStorage.getItem("userIdActual");
            document.getElementById("perfil-id-usuario").innerText = `ID de Cuenta: ${miUsuarioId}`;
        }

       
        function renderizarMisReportes() {
            const contenedor = document.getElementById("mis-reportes-lista");
            const miUsuarioId = localStorage.getItem("userIdActual");

            const todosLosReportes = JSON.parse(localStorage.getItem("reportesMascotas")) || [];

         
            const misReportes = todosLosReportes.filter(reporte => reporte.userId === miUsuarioId);

         
            if (misReportes.length === 0) {
                contenedor.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #64748b; background: white; border-radius: 20px; border: 2px dashed #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                        <span style="font-size: 2.5rem;">🐾</span>
                        <h3 style="margin: 10px 0 5px 0; font-weight: 800; color: #1e293b;">No tienes reportes creados</h3>
                        <p style="margin: 0; font-size: 0.9rem; color: #94a3b8;">Las mascotas que reportes como perdidas o encontradas aparecerán organizadas en este panel.</p>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = "";
            
         
            misReportes.reverse().forEach(reporte => {
                const claseEstado = reporte.estado === "perdida" ? "perdido" : "encontrado";
                
                const tarjetaHTML = `
                    <div class="pet-card" id="card-${reporte.id}">
                        <div class="pet-img-container" style="height: 180px; position: relative; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                            <span class="status-label ${claseEstado}" style="position: absolute; top: 12px; left: 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">${reporte.estado}</span>
                            ${reporte.foto} 
                        </div>
                        <div class="pet-card-content" style="padding: 18px; display: flex; flex-direction: column;">
                            <h3 style="margin: 0 0 10px 0; font-size: 1.15rem; color: #1e293b; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${reporte.titulo}</h3>
                            <div class="pet-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                                <span style="background: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 600;">📍 ${reporte.ubicacion}</span>
                                <span style="background: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 600;">🎨 ${reporte.color}</span>
                            </div>
                            <p style="font-size: 0.85rem; color: #64748b; margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;">
                                ${reporte.descripcion}
                            </p>
                            
                            <div style="display: flex; gap: 10px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f1f5f9;">
                                <span style="font-size: 0.75rem; color: #94a3b8; align-self: center; font-weight: 600;">📅 ${reporte.fecha}</span>
                                <button class="btn-card-details" style="margin-left: auto; background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; transition: background 0.2s;" onclick="eliminarReporte('${reporte.id}')">
                                    ELIMINAR
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHTML;
            });
        }

      
        function eliminarReporte(reporteId) {
            if (confirm("¿Estás seguro de que deseas eliminar permanentemente este reporte de la plataforma?")) {
                let todosLosReportes = JSON.parse(localStorage.getItem("reportesMascotas")) || [];
                
          
                todosLosReportes = todosLosReportes.filter(reporte => reporte.id !== reporteId);
      
                localStorage.setItem("reportesMascotas", JSON.stringify(todosLosReportes));
                
          
                renderizarMisReportes();
                alert("El reporte ha sido retirado del tablón comunitario con éxito.");
            }
        }
    </script>
</body>
</html>
