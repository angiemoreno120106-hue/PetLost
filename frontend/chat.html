<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat PetLost</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body class="chat-screen">

    <header class="chat-header">
        <a href="perfil.html" class="back-link">←</a>
        <div class="pet-thumb">🐕</div>
        <div class="chat-user-details">
            <h4>Sammy</h4>
            <p>Juan Pérez • En línea</p>
        </div>
    </header>

    <main class="chat-body">
        <div class="msg msg-in">
            Hola Angie, acabo de ver a Sammy cerca de la entrada de la USB Bogotá. 
            <span class="msg-time">12:15 PM</span>
        </div>

        <div class="msg msg-out">
            ¡No puede ser! ¿Seguro que era él? ¿Tenía el collar verde?
            <span class="msg-time">12:16 PM</span>
        </div>

        <div class="msg msg-in">
            Sí, estoy seguro. Tenía el collar y se veía bien.
            <span class="msg-time">12:18 PM</span>
        </div>
    </main>

    <footer class="chat-footer">
        <div class="input-box">
            <input type="text" placeholder="Escribe un mensaje aquí...">
        </div>
        <button class="send-icon-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

</body>
</html>
