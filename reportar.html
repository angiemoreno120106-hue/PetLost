<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Mascota | PetLost</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --transition: all 0.25s ease;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: var(--background);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar{
            width: 100%;
            background: var(--surface);
            padding: 16px 32px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo img{
            width: 36px; 
            height: 36px;
            object-fit: cover;
        }

        .logo h1{
            font-size: 1.35rem; 
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .btn-feed{
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 8px 18px; 
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .btn-feed:hover {
            background: var(--primary);
            color: white;
        }

       
        .container{
            width: 100%;
            max-width: 720px; 
            margin: 30px auto 60px auto; /* Aumentado margen inferior para dar espacio al menú */
            padding: 0 20px;
            flex: 1;
        }

        .card{
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 35px; 
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .titulo{
            font-size: 1.6rem; 
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitulo{
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px; 
            line-height: 1.5;
        }

       
        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px; 
        }

        .campo{
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }

        .campo-full{
            grid-column: 1 / -1;
        }

        label{
            font-weight: 600;
            font-size: 0.8rem; 
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        select,
        textarea{
            width: 100%;
            border: 2px solid var(--border);
            border-radius: var(--radius-md); 
            padding: 10px 14px; 
            font-size: 0.9rem; 
            outline: none;
            transition: var(--transition);
            background: #f8fafc;
            color: var(--text-main);
        }

        select {
            cursor: pointer;
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        input[type="file"] {
            padding: 8px;
            background: var(--surface);
            cursor: pointer;
        }

        textarea{
            resize: none;
            min-height: 90px; 
        }

        
        .preview{
            width: 8cm;   
            height: 8cm;  
            margin: 15px auto; 
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            border: 2px dashed #cbd5e1;
            background: #f8fafc; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: var(--transition);
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .preview-icon{
            font-size: 2.2rem; 
            margin-bottom: 6px;
        }

        .preview-text{
            font-weight: 700;
            color: #475569;
            font-size: 0.85rem;
        }

        .preview-subtext{
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 4px;
            padding: 0 20px;
        }

    
        .btn-publicar{
            width: 100%;
            margin-top: 25px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-publicar:hover{
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }
        
        .btn-publicar:active {
            transform: translateY(1px);
        }

       
        .mensaje{
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .success{
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .error{
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media(max-width: 768px){
            .grid{
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .card{
                padding: 24px;
            }
            .navbar{
                padding: 14px 20px;
            }
            .preview {
                width: 100%;
                max-width: 8cm;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='feed.html'">
            <img src="assets/logo.png" alt="PetLost">
            <h1>PetLost</h1>
        </div>
        <button class="btn-feed" onclick="window.location.href='feed.html'">
            Ver Feed
        </button>
    </nav>

    <div class="container">
        <div class="card">
            <h2 class="titulo">Reportar Mascota</h2>
            <p class="subtitulo">
                Completa la información para ayudar a encontrar mascotas perdidas.
            </p>

            <form id="formReporte">
                <div class="grid">
                    <div class="campo">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" placeholder="Ejemplo: Se perdió perro labrador" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" required>
                            <option value="">Selecciona</option>
                            <option value="perdida">Perdida</option>
                            <option value="encontrada">Encontrada</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" required>
                            <option value="">Selecciona</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave">Ave</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="color">Color</label>
                        <input type="text" id="color" placeholder="Ejemplo: Negro y blanco" required>
                    </div>

                    <div class="campo campo-full">
                        <label for="ubicacion">Ubicación (Localidad de Bogotá)</label>
                        <select id="ubicacion" required>
                            <option value="">Selecciona una localidad ↓</option>
                            <option value="Antonio Nariño">Antonio Nariño</option>
                            <option value="Barrios Unidos">Barrios Unidos</option>
                            <option value="Bosa">Bosa</option>
                            <option value="Chapinero">Chapinero</option>
                            <option value="Ciudad Bolívar">Ciudad Bolívar</option>
                            <option value="Engativá">Engativá</option>
                            <option value="Fontibón">Fontibón</option>
                            <option value="Kennedy">Kennedy</option>
                            <option value="La Candelaria">La Candelaria</option>
                            <option value="Los Mártires">Los Mártires</option>
                            <option value="Puente Aranda">Puente Aranda</option>
                            <option value="Rafael Uribe Uribe">Rafael Uribe Uribe</option>
                            <option value="San Cristóbal">San Cristóbal</option>
                            <option value="Santa Fé">Santa Fé</option>
                            <option value="Suba">Suba</option>
                            <option value="Teusaquillo">Teusaquillo</option>
                            <option value="Tunjuelito">Tunjuelito</option>
                            <option value="Usaquén">Usaquén</option>
                            <option value="Usme">Usme</option>
                            <option value="Sumapaz">Sumapaz</option>
                        </select>
                    </div>

                    <div class="campo campo-full">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" placeholder="Describe características importantes de la mascota..." required></textarea>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="3005551122" required>
                    </div>

                    <div class="campo">
                        <label for="foto">Foto</label>
                        <input type="file" id="foto" accept="image/*" required>
                    </div>

                    <div class="campo campo-full">
                        <div class="preview" id="previewFoto">
                            <div class="preview-icon">📸</div>
                            <div class="preview-text">Vista previa de imagen</div>
                            <div class="preview-subtext">Selecciona una fotografía de la mascota</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-publicar">
                    Publicar Reporte
                </button>

                <div id="mensaje"></div>
            </form>
        </div>
    </div>

    <script>
        const inputFoto = document.getElementById("foto");
        const previewFoto = document.getElementById("previewFoto");
        const formReporte = document.getElementById("formReporte");
        const mensaje = document.getElementById("mensaje");

        let imagenBase64 = "";

        inputFoto.addEventListener("change", function(event){
            const archivo = event.target.files[0];
            if(!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e){
                imagenBase64 = e.target.result; 
                previewFoto.innerHTML = `<img src="${imagenBase64}" alt="Mascota">`;
                previewFoto.style.padding = "0"; 
                previewFoto.style.borderStyle = "solid";
            };
            lector.readAsDataURL(archivo);
        });

        class ReporteMascota {
            constructor(titulo, estado, tipo, color, ubicacion, descripcion, foto, telefono){
                this.id = crypto.randomUUID();
                this.titulo = titulo.trim();
                this.estado = estado;
                this.tipo = tipo;
                this.color = color.trim();
                this.ubicacion = ubicacion; 
                this.descripcion = descripcion.trim();
                this.foto = foto; 
                this.telefono = telefono.replace(/\D/g,"");
                this.fecha = new Date().toLocaleDateString(); 
                this.fechaHumana = new Date().toLocaleString();
            }

            validar(){
                if(!this.titulo || !this.descripcion || !this.telefono || !this.ubicacion || !this.foto){
                    throw new Error("Todos los campos son obligatorios, incluyendo la fotografía.");
                }
                if(this.telefono.length < 7){
                    throw new Error("Número telefónico inválido.");
                }
                if(this.descripcion.length < 10){
                    throw new Error("La descripción debe tener al menos 10 caracteres.");
                }
            }

            obtenerObjeto(){
                return {
                    id: this.id,
                    titulo: this.titulo,
                    estado: this.estado,
                    tipo: this.tipo,
                    color: this.color,
                    ubicacion: this.ubicacion,
                    descripcion: this.descripcion,
                    foto: this.foto,
                    telefono: this.telefono,
                    fecha: this.fecha,
                    fechaHumana: this.fechaHumana
                };
            }

            guardarLocal(){
                this.validar();
                const reportesExistentes = JSON.parse(localStorage.getItem("reportesMascotas")) || [];
                reportesExistentes.push(this.obtenerObjeto());
                localStorage.setItem("reportesMascotas", JSON.stringify(reportesExistentes));
            }
        }

        formReporte.addEventListener("submit", function(e){
            e.preventDefault();

            try{
                const titulo = document.getElementById("titulo").value;
                const estado = document.getElementById("estado").value;
                const tipo = document.getElementById("tipo").value;
                const color = document.getElementById("color").value;
                const ubicacion = document.getElementById("ubicacion").value; 
                const descripcion = document.getElementById("descripcion").value;
                const telefono = document.getElementById("telefono").value;

                if(!imagenBase64) {
                    throw new Error("Por favor, selecciona una fotografía de la mascota.");
                }

                const reporte = new ReporteMascota(
                    titulo, estado, tipo, color, ubicacion, descripcion, imagenBase64, telefono
                );

                reporte.guardarLocal();

                mostrarMensaje("¡Reporte guardado con éxito! Redirigiendo al feed...", "success");
                formReporte.reset();
                imagenBase64 = "";

                previewFoto.style.padding = "10px";
                previewFoto.style.borderStyle = "dashed";
                previewFoto.innerHTML = `
                    <div class="preview-icon">📸</div>
                    <div class="preview-text">Vista previa de imagen</div>
                    <div class="preview-subtext">Selecciona una fotografía de la mascota</div>
                `;

                setTimeout(() => {
                    window.location.href = "feed.html";
                }, 1500);

            }catch(error){
                mostrarMensaje(error.message, "error");
            }
        });

        function mostrarMensaje(texto, tipo){
            mensaje.style.display = "block";
            mensaje.className = `mensaje ${tipo}`;
            mensaje.innerText = texto;
        }
    </script>
</body>
</html>
